name: Agent Goal
description: 提交一个有界、可验证、可由 Agent 编排器处理的目标
title: "[Agent Goal]: "
labels:
  - agent:candidate
body:
  - type: markdown
    attributes:
      value: |
        此模板用于 AI Agent 试点。提交前请确认内容不涉及未批准的生产操作、密钥或权限变更。
        不得包含密码、token、私钥或生产数据。高风险目标会停止并转人工确认。

  - type: textarea
    id: goal
    attributes:
      label: 具体目标
      description: 描述完成后可观察到的结果，不要使用“持续优化”或“修复所有问题”等无界目标。
      placeholder: 当……时，系统应……
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: 价值与动机
      description: 说明该目标解决的问题以及受益者。
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 范围
      description: 列出允许修改的行为、模块或文档范围。
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: 非目标
      description: 明确本任务不应顺手实现的内容。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 每行一个可执行或可观察的验收场景，使用稳定ID并绑定下方必需验证中的一条命令。
      placeholder: |
        - [ ] AC-EXAMPLE-01 | Given ... When ... Then ... | Evidence: `./gradlew :module:test`
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: 必需验证
      description: 列出聚焦测试、集成测试、质量门禁或人工检查要求。
      placeholder: ./gradlew :module:test
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: 风险类型
      description: 高风险项不会被自动接受，必须转人工审批。
      options:
        - 低风险：文档、测试或可逆内部实现
        - 中风险：跨模块或外部可观察行为
        - 高风险：公共契约、认证授权、隐私、多租户
        - 高风险：金额、库存、订单状态或数据语义
        - 高风险：不可逆数据、生产、密钥、权限或付费操作
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与迁移
      description: 明确公开 API、事件、schema、数据或依赖的兼容性结论；不适用时说明原因。
    validations:
      required: true

  - type: textarea
    id: recovery
    attributes:
      label: 恢复与回滚
      description: 说明失败后的恢复或回滚方式；不适用时说明原因。
    validations:
      required: true

  - type: textarea
    id: required_approvals
    attributes:
      label: 所需人工审批
      description: 低风险且无额外审批时填写 None；否则每行列出一个审批所有者。
      placeholder: None
    validations:
      required: true

  - type: textarea
    id: residual_risk
    attributes:
      label: 残余风险
      description: 每行列出一个交付后仍需人工理解的限制、未运行检查或观察事项。
    validations:
      required: true

  - type: checkboxes
    id: authorization
    attributes:
      label: 确认
      options:
        - label: 我确认目标有界，且 Issue 中没有秘密或生产数据。
          required: true
        - label: 我理解自动化只准备候选，不会自动合并、发布或执行生产操作。
          required: true
