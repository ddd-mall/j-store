name: Security Gate

on:
  pull_request:
  push:
    branches: [develop, master]
  schedule:
    - cron: "30 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout pinned Semgrep community rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: semgrep/semgrep-rules
          ref: 40b8c63f75dc7c22c8a77482d73bfb864b146f7e
          path: .semgrep-rules
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install pinned Semgrep CE
        run: >-
          python -m pip install
          --disable-pip-version-check
          --index-url https://pypi.org/simple
          -r requirements-security.txt

      - name: Scan source with pinned Semgrep community rules
        run: |
          set -euo pipefail
          rule_bundle="$RUNNER_TEMP/semgrep-rules"
          mkdir -p "$rule_bundle"
          (
            cd "$GITHUB_WORKSPACE/.semgrep-rules"
            find java kotlin generic yaml json dockerfile bash python javascript typescript \
              -type f \( -name '*.yml' -o -name '*.yaml' \) \
              ! -path '*/audit/*' \
              ! -path '*/best-practice/*' \
              ! -path '*/correctness/*' \
              ! -path '*/maintainability/*' \
              ! -path '*/performance/*' \
              ! -path '*/compatibility/*' \
              -exec cp --parents '{}' "$rule_bundle" ';'
          )
          test "$(find "$rule_bundle" -type f | wc -l)" -gt 0
          semgrep scan --config "$rule_bundle" --error --severity ERROR \
            --metrics off --json --output semgrep-results.json .

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: semgrep-results-${{ github.run_id }}
          path: semgrep-results.json
          if-no-files-found: ignore
          retention-days: 14

  dependency-vulnerability-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      OSV_SCANNER_VERSION: "2.4.0"
      OSV_SCANNER_LINUX_X64_SHA256: "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Generate production dependency SBOM
        run: ./gradlew :j-store-boot:cyclonedxDirectBom --no-daemon

      - name: Install verified OSV Scanner CLI
        shell: bash
        run: |
          set -euo pipefail
          binary="osv-scanner_linux_amd64"
          url="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/${binary}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "$url" --output "$RUNNER_TEMP/osv-scanner"
          printf '%s  %s\n' "$OSV_SCANNER_LINUX_X64_SHA256" "$RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" --version

      - name: Scan resolved Gradle dependencies
        run: >-
          "$RUNNER_TEMP/osv-scanner" scan source
          --lockfile j-store-boot/build/reports/cyclonedx-direct/bom.json
          --format json
          --output-file osv-results.json

      - name: Set up attestation-capable Buildx builder
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build attested OCI archive for container security scanning
        env:
          BUILDX_METADATA_PROVENANCE: max
        run: |
          ./gradlew :j-store-boot:bootJar --no-daemon --console=plain
          docker buildx build \
            --output type=oci,dest=j-store-security.tar \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file container-build-metadata.json \
            --tag "j-store-security:${GITHUB_SHA}" \
            j-store-boot

      - name: Convert attested OCI archive for OSV Scanner
        env:
          SKOPEO_IMAGE: "quay.io/skopeo/stable@sha256:47853bb9fb24202af9110531ebd6e43c5f97701254ca290596640290d17942f4"
        run: |
          docker run --rm \
            --network none \
            --volume "${GITHUB_WORKSPACE}:/work:ro" \
            --volume "${RUNNER_TEMP}:/output" \
            "$SKOPEO_IMAGE" copy \
            --override-os linux \
            --override-arch amd64 \
            oci-archive:/work/j-store-security.tar \
            docker-archive:/output/j-store-security-docker.tar

      - name: Scan container operating-system and application packages
        run: >-
          "$RUNNER_TEMP/osv-scanner" scan image --archive
          "$RUNNER_TEMP/j-store-security-docker.tar"
          --format json
          --output-file osv-container-results.json

      - name: Upload dependency vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: osv-results-${{ github.run_id }}
          path: |
            osv-results.json
            osv-container-results.json
            container-build-metadata.json
            j-store-boot/build/reports/cyclonedx-direct/bom.json
          if-no-files-found: ignore
          retention-days: 14

  dependency-license-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Audit direct and transitive dependency licenses
        run: ./gradlew licensee --no-daemon --console=plain

      - name: Upload dependency license reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-license-reports-${{ github.run_id }}
          path: "**/build/reports/licensee/**"
          if-no-files-found: error
          retention-days: 30

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "$url" --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan Git history for secrets
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
            "$RUNNER_TEMP/gitleaks" git . --redact --no-banner \
              --gitleaks-ignore-path .gitleaksignore --log-opts="$range"
          else
            "$RUNNER_TEMP/gitleaks" git . --redact --no-banner \
              --gitleaks-ignore-path .gitleaksignore
          fi
