apiVersion: apps/v1
kind: Deployment
metadata:
  name: symphony
  namespace: agentic-cicd
  labels:
    app.kubernetes.io/name: symphony
    app.kubernetes.io/component: supervisor
    app.kubernetes.io/part-of: j-store-agentic-cicd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: symphony
  template:
    metadata:
      labels:
        app.kubernetes.io/name: symphony
        app.kubernetes.io/component: supervisor
        app.kubernetes.io/part-of: j-store-agentic-cicd
    spec:
      serviceAccountName: symphony
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: symphony
          image: jstore-agentic-cicd:8001b52e-codex-0.146.0
          imagePullPolicy: IfNotPresent
          args:
            - --i-understand-that-this-will-be-running-without-the-usual-guardrails
            - --logs-root
            - /var/lib/symphony/logs
            - --port
            - "4000"
            - /etc/symphony/WORKFLOW.md
          env:
            - name: HOME
              value: /var/lib/symphony/home
            - name: JSTORE_SYMPHONY_WORKSPACE_ROOT
              value: /var/lib/symphony/workspaces
            - name: JSTORE_SYMPHONY_REPOSITORY_URL
              value: https://github.com/ddd-mall/j-store.git
            - name: JSTORE_SYMPHONY_GITHUB_TOKEN
              value: level0-no-github-access
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/v1/state
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/v1/state
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/state
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: state
              mountPath: /var/lib/symphony
            - name: workflow
              mountPath: /etc/symphony
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: symphony-state
        - name: workflow
          configMap:
            name: symphony-workflow
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
