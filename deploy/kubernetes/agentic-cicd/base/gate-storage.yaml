apiVersion: v1
kind: PersistentVolume
metadata:
  name: agentic-cicd-candidate-artifacts
  labels:
    app.kubernetes.io/part-of: j-store-agentic-cicd
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /var/lib/jstore-agentic-candidates
  claimRef:
    namespace: agentic-cicd
    name: candidate-artifacts
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [k8s-master]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: candidate-artifacts
  namespace: agentic-cicd
spec:
  storageClassName: ""
  volumeName: agentic-cicd-candidate-artifacts
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
