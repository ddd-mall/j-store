apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - service-account.yaml
  - state-pv.yaml
  - state-pvc.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: symphony-workflow
    namespace: agentic-cicd
    files:
      - WORKFLOW.md
generatorOptions:
  labels:
    app.kubernetes.io/name: symphony
    app.kubernetes.io/part-of: j-store-agentic-cicd
