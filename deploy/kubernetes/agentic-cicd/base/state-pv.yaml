apiVersion: v1
kind: PersistentVolume
metadata:
  name: agentic-cicd-symphony-state
  labels:
    app.kubernetes.io/name: symphony
    app.kubernetes.io/part-of: j-store-agentic-cicd
spec:
  capacity:
    storage: 40Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /var/lib/jstore-agentic-cicd
  claimRef:
    namespace: agentic-cicd
    name: symphony-state
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-master
