apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: agentic-cicd-gates
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gate-to-artifact-broker
  namespace: agentic-cicd-gates
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: gate-runner
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentic-cicd
          podSelector:
            matchLabels:
              app.kubernetes.io/name: artifact-broker
      ports:
        - {protocol: TCP, port: 8081}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: artifact-broker-from-gates
  namespace: agentic-cicd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: artifact-broker
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentic-cicd-gates
          podSelector:
            matchLabels:
              app.kubernetes.io/component: gate-runner
      ports:
        - {protocol: TCP, port: 8081}
