apiVersion: batch/v1
kind: Job
metadata:
  name: gate-offline-smoke
  namespace: agentic-cicd-gates
  labels:
    app.kubernetes.io/name: gate-offline-smoke
    app.kubernetes.io/component: gate-runner
    app.kubernetes.io/part-of: j-store-agentic-cicd
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gate-offline-smoke
        app.kubernetes.io/component: gate-runner
        app.kubernetes.io/part-of: j-store-agentic-cicd
    spec:
      restartPolicy: Never
      serviceAccountName: gate-runner
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k8s-worker1
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gate
          image: docker.m.daocloud.io/library/busybox@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token
              if wget -T 3 -qO- http://j-store.jstore.svc.cluster.local:8080/actuator/health; then
                echo "unexpected network access" >&2
                exit 1
              fi
              printf '%s\n' GATE_OFFLINE_SMOKE_PASS
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
