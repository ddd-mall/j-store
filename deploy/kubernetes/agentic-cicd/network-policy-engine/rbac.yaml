apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-router-firewall
  namespace: kube-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jstore-kube-router-firewall
rules:
  - apiGroups:
      - ""
    resources:
      - endpoints
      - namespaces
      - nodes
      - pods
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jstore-kube-router-firewall
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jstore-kube-router-firewall
subjects:
  - kind: ServiceAccount
    name: kube-router-firewall
    namespace: kube-system
