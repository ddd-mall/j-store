apiVersion: apps/v1
kind: Deployment
metadata:
  name: symphony
  namespace: agentic-cicd
spec:
  template:
    spec:
      initContainers:
        - name: prepare-codex-home
          image: jstore-agentic-cicd:development-placeholder
          imagePullPolicy: Never
          command:
            - /usr/bin/install
            - -d
            - -m
            - "0700"
            - /var/lib/symphony/home/.codex
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: state
              mountPath: /var/lib/symphony
      containers:
        - name: symphony
          volumeMounts:
            - name: codex-auth
              mountPath: /var/lib/symphony/home/.codex/auth.json
              subPath: auth.json
              readOnly: true
            - name: codex-auth
              mountPath: /var/lib/symphony/home/.codex/config.toml
              subPath: config.toml
              readOnly: true
      volumes:
        - name: codex-auth
          secret:
            secretName: symphony-codex-auth
            optional: false
            defaultMode: 0440
