apiVersion: apps/v1
kind: Deployment
metadata:
  name: j-store
  labels:
    app.kubernetes.io/name: j-store
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: j-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: j-store
        app.kubernetes.io/component: application
        jstore.logs/enabled: "true"
        jstore.logs/environment: kubernetes-development
      annotations:
        jstore.dev/artifact-sha256: replace-by-deploy-script
    spec:
      serviceAccountName: j-store
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: docker.m.daocloud.io/library/amazoncorretto:25-al2023-headless
          imagePullPolicy: IfNotPresent
          command: ["java"]
          args:
            - -XX:MaxRAMPercentage=75.0
            - -Djava.io.tmpdir=/tmp
            - -jar
            - /opt/jstore/app.jar
          envFrom:
            - configMapRef:
                name: jstore-runtime
            - secretRef:
                name: jstore-runtime
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            failureThreshold: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 3
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: artifact
              mountPath: /opt/jstore
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifact
          persistentVolumeClaim:
            claimName: jstore-artifact
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: j-store
  labels:
    app.kubernetes.io/name: j-store
    app.kubernetes.io/component: application
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: j-store
  ports:
    - name: http
      port: 8080
      targetPort: http
