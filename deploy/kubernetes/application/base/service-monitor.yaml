apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: j-store
  labels:
    app.kubernetes.io/name: j-store
    app.kubernetes.io/part-of: j-store
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: j-store
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
