apiVersion: apps/v1
kind: Deployment
metadata:
  name: j-store
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/environment: canary
        jstore.logs/environment: canary
    spec:
      containers:
        - name: application
          env:
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: j-store
