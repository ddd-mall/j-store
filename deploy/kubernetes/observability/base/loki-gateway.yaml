apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-gateway-config
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr notice;

    events {
      worker_connections 1024;
    }

    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;

      server {
        listen 8443 ssl;
        server_name loki-gateway.jstore-observability.svc loki-gateway.jstore-observability.svc.cluster.local;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        auth_basic "j-store observability";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;

        location / {
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_pass http://loki:3100;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-gateway
  labels:
    app.kubernetes.io/name: loki-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-gateway
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: observability-backend
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29.1-alpine
          args: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
          ports:
            - name: https
              containerPort: 8443
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            tcpSocket:
              port: https
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: auth
              mountPath: /etc/nginx/auth
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: config
          configMap:
            name: loki-gateway-config
        - name: auth
          secret:
            secretName: loki-gateway-auth
        - name: tls
          secret:
            secretName: loki-gateway-tls
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: cache
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: loki-gateway
  labels:
    app.kubernetes.io/name: loki-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loki-gateway
  ports:
    - name: https
      port: 443
      targetPort: https
