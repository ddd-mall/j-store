apiVersion: apps/v1
kind: Deployment
metadata:
  name: j-store-example
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: j-store-example
        jstore.logs/enabled: "true"
        jstore.logs/environment: development
        jstore.metrics/enabled: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: application
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: observability
            - name: JSTORE_SERVICE_NAME
              value: j-store-example
            - name: JSTORE_DEPLOYMENT_ENVIRONMENT
              value: development
