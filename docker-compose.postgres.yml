services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: j-store-postgres:16-alpine
    container_name: j-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: j_store
      POSTGRES_USER: develop
      POSTGRES_PASSWORD: Jupeter104741
      TZ: Asia/Shanghai
    ports:
      - "30432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U develop -d j_store"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: j-store-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
