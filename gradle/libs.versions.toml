[versions]
guava = "33.6.0-jre"
spring-boot = "3.5.16"
spring-modulith-bom = "1.3.3"
spring-cloud = "2023.0.5"
spring-cloud-alibaba = "2023.0.3.2"
kotest = "6.2.3"
postgresql = "42.7.12"
kotlin = "2.4.10"
spotless = "8.9.0"
