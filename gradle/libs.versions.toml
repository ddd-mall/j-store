openai-version = "4.50.0"
dashscope-sdk-java = "2.22.5"

[libraries]
guava = { module = "com.google.guava:guava", version.ref = "guava" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith-bom" }
