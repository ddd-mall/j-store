[versions]
guava = "33.6.0-jre"
spring-boot = "3.5.16"
kotest = "6.2.3"
kotlin = "2.4.10"
spotless = "8.9.0"
fastexcel = "1.3.0"
junit = "6.1.2"
mockito = "5.23.0"
mockito-kotlin = "6.3.0"
libphonenumber = "9.0.36"
jjwt = "0.13.0"
open-telemetry = "1.62.0"
jackson = "2.21.5"
netty = "4.1.136.Final"
postgresql = "42.7.12"
commons-lang3 = "3.19.0"
embedded-redis = "1.4.3"
embedded-postgres = "2.1.0"
money-api = "1.1"
licensee = "1.14.1"
cyclonedx = "3.3.0"
google-java-format = "1.35.0"
ktfmt = "0.63"

[libraries]
# Platforms
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
open-telemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "open-telemetry" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }

# Kotlin and testing
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
embedded-postgres = { module = "io.zonky.test:embedded-postgres", version.ref = "embedded-postgres" }
embedded-redis = { module = "com.github.codemonstur:embedded-redis", version.ref = "embedded-redis" }
h2 = { module = "com.h2database:h2" }

# Spring and runtime infrastructure managed by the unified platform
spring-boot-core = { module = "org.springframework.boot:spring-boot" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-context = { module = "org.springframework:spring-context" }
spring-jdbc = { module = "org.springframework:spring-jdbc" }
spring-tx = { module = "org.springframework:spring-tx" }
spring-data-commons = { module = "org.springframework.data:spring-data-commons" }
spring-data-redis = { module = "org.springframework.data:spring-data-redis" }
spring-data-jpa = { module = "org.springframework.data:spring-data-jpa" }
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
lombok = { module = "org.projectlombok:lombok" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
micrometer-core = { module = "io.micrometer:micrometer-core" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }

# Application libraries not managed by Spring Boot
guava = { module = "com.google.guava:guava", version.ref = "guava" }
fastexcel = { module = "cn.idev.excel:fastexcel", version.ref = "fastexcel" }
libphonenumber = { module = "com.googlecode.libphonenumber:libphonenumber", version.ref = "libphonenumber" }
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }
money-api = { module = "javax.money:money-api", version.ref = "money-api" }

# Jackson coordinates are aligned by the approved security BOM
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }

[plugins]
springframework = { id = "org.springframework.boot", version.ref = "spring-boot" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-plugin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-plugin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
licensee = { id = "app.cash.licensee", version.ref = "licensee" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
