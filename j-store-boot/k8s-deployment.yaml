apiVersion: apps/v1
kind: Deployment
metadata:
  name: j-store-order-deployment
  labels:
    app: j-store-order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: j-store-order
  template:
    metadata:
      labels:
        app: j-store-order
    spec:
      containers:
      - name: j-store-order
        image: j-store-order-boot:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"

