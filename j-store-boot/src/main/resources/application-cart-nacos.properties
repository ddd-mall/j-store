# Activate alongside the deployment profile: --spring.profiles.active=local,cart-nacos
jstore.cart.nacos.enabled=true
jstore.cart.nacos.server-addr=${NACOS_SERVER_ADDR}
jstore.cart.nacos.namespace=${NACOS_NAMESPACE:public}
jstore.cart.nacos.group=${NACOS_GROUP:DEFAULT_GROUP}
jstore.cart.nacos.data-id=${NACOS_CART_DATA_ID:j-store-cart.properties}
jstore.cart.nacos.username=${NACOS_USERNAME:}
jstore.cart.nacos.password=${NACOS_PASSWORD:}
