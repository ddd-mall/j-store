server.port=8080
spring.datasource.url=${JSTORE_DB_URL:jdbc:postgresql://localhost:30432/j_store?currentSchema=develop}
spring.datasource.username=${JSTORE_DB_USER:develop}
spring.datasource.password=${JSTORE_DB_PASSWORD}

spring.datasource.hikari.pool-name=j-store
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.maximum-pool-size=20

spring.flyway.default-schema=develop
spring.flyway.schemas=develop
spring.flyway.create-schemas=true

spring.jpa.open-in-view = true
#spring.jpa.hibernate.ddl-auto=update
# Redis??
spring.data.redis.host=${JSTORE_REDIS_HOST:localhost}
spring.data.redis.port=${JSTORE_REDIS_PORT:6379}
spring.data.redis.password=${JSTORE_REDIS_PASSWORD:}
spring.data.redis.database=${JSTORE_REDIS_DATABASE:0}
spring.data.redis.timeout=2000ms



#spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
#spring.cloud.nacos.discovery.group=j-store

#spring.cloud.nacos.config.server-addr=127.0.0.1:8848
#spring.cloud.nacos.config.namespace=public
#spring.cloud.nacos.config.group=${spring.cloud.nacos.discovery.group}
#spring.config.import[0] = nacos:${spring.application.name}?refreshEnabled=true?



# Phone verification proof key; OAuth signing configuration is shared in application.properties.
account.phone-verification.hmac-secret=${JSTORE_PHONE_VERIFICATION_HMAC_SECRET}

logging.level.root=info

# Outbox
jstore.outbox.enabled=true
# 每个目标生成独立 Outbox 记录；Kafka/RabbitMQ 由独立 transport adapter 提供。
jstore.messaging.targets=local
jstore.user-query.mode=local
jstore.user-query.server.enabled=false
jstore.order.merchant-id=1

server.servlet.session.cookie.secure=false
