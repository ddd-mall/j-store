logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.version=${JSTORE_SERVICE_VERSION:dev}
logging.structured.ecs.service.environment=${JSTORE_DEPLOYMENT_ENVIRONMENT:local}
logging.structured.json.rename.traceId=trace_id
logging.structured.json.rename.spanId=span_id
spring.output.ansi.enabled=never

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${JSTORE_TRACING_SAMPLING_PROBABILITY:1.0}
