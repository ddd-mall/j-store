server.port=8080

spring.datasource.url=${JSTORE_DB_URL}
spring.datasource.username=${JSTORE_DB_USER}
spring.datasource.password=${JSTORE_DB_PASSWORD}
spring.datasource.hikari.pool-name=j-store
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.maximum-pool-size=${JSTORE_DB_POOL_MAX_SIZE:20}

spring.flyway.default-schema=${JSTORE_DB_SCHEMA:j_store}
spring.flyway.schemas=${JSTORE_DB_SCHEMA:j_store}
spring.flyway.create-schemas=false

spring.jpa.open-in-view=false

spring.data.redis.host=${JSTORE_REDIS_HOST}
spring.data.redis.port=${JSTORE_REDIS_PORT:6379}
spring.data.redis.password=${JSTORE_REDIS_PASSWORD}
spring.data.redis.database=${JSTORE_REDIS_DATABASE:0}
spring.data.redis.timeout=${JSTORE_REDIS_TIMEOUT:2000ms}

jwt.access-secret=${JSTORE_JWT_ACCESS_SECRET}
jwt.refresh-secret=${JSTORE_JWT_REFRESH_SECRET}
jwt.issuer=${JSTORE_JWT_ISSUER:j-store}
jwt.audience=${JSTORE_JWT_AUDIENCE:j-store-api}
jwt.key-id=${JSTORE_JWT_KEY_ID}
account.phone-verification.hmac-secret=${JSTORE_PHONE_VERIFICATION_HMAC_SECRET}

logging.level.root=info

jstore.outbox.enabled=true
jstore.messaging.targets=${JSTORE_MESSAGING_TARGETS:local}
jstore.user-query.mode=${JSTORE_USER_QUERY_MODE:local}
jstore.user-query.server.enabled=${JSTORE_USER_QUERY_SERVER_ENABLED:false}
