spring.application.name=j-store
server.shutdown=graceful
spring.profiles.group.production=observability,outbox-observability

# Deployment-level site currency policy. Domain code remains currency-agnostic.
jstore.site.default-currency=${JSTORE_SITE_DEFAULT_CURRENCY:CNY}
jstore.site.allowed-currencies=${JSTORE_SITE_ALLOWED_CURRENCIES:CNY}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=20260507
spring.flyway.validate-on-migrate=true

# OIDC is the sole consumer token issuer; signing material is provided externally.
jstore.oidc.issuer=${JSTORE_OIDC_ISSUER}
jstore.oidc.resource-audience=${JSTORE_OIDC_RESOURCE_AUDIENCE:j-store-api}
jstore.oidc.jwk-set-location=${JSTORE_OIDC_JWK_SET_LOCATION:}
jstore.oidc.active-key-id=${JSTORE_OIDC_ACTIVE_KEY_ID:}
jstore.oidc.clients[0].id=${JSTORE_OIDC_CLIENT_ID:web}
jstore.oidc.clients[0].name=${JSTORE_OIDC_CLIENT_NAME:JStore}
jstore.oidc.clients[0].secret-hash=${JSTORE_OIDC_CLIENT_SECRET_HASH:}
jstore.oidc.clients[0].redirects=${JSTORE_OIDC_CLIENT_REDIRECTS}
jstore.oidc.clients[0].post-logout-redirects=${JSTORE_OIDC_CLIENT_POST_LOGOUT_REDIRECTS:}
jstore.oidc.clients[0].scopes=${JSTORE_OIDC_CLIENT_SCOPES:openid,profile}
jstore.oidc.clients[0].audiences=${JSTORE_OIDC_CLIENT_AUDIENCES:j-store-api}
jstore.oidc.clients[0].cors-origins=${JSTORE_OIDC_CLIENT_CORS_ORIGINS:}
jstore.oidc.wechat.enabled=${JSTORE_WECHAT_ENABLED:false}
jstore.oidc.wechat.app-id=${JSTORE_WECHAT_APP_ID:}
jstore.oidc.wechat.secret=${JSTORE_WECHAT_APP_SECRET:}
jstore.oidc.wechat.callback-uri=${JSTORE_WECHAT_CALLBACK_URI:}
spring.session.timeout=30m
spring.session.redis.namespace=jstore:oidc:sessions
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
