# J-Store Monolithic Application Configuration - Properties Format

# Application Basic Information
spring.application.name=j-store-monolithic

# ======================================
# Multi DataSource Configuration
# ======================================

# Order Module DataSource (Primary DataSource)
spring.datasource.order.url=jdbc:postgresql://localhost:5432/j_store_order
spring.datasource.order.username=postgres
spring.datasource.order.password=postgres
spring.datasource.order.driver-class-name=org.postgresql.Driver

# Goods Module DataSource
spring.datasource.goods.url=jdbc:postgresql://localhost:5432/j_store_goods
spring.datasource.goods.username=postgres
spring.datasource.goods.password=postgres
spring.datasource.goods.driver-class-name=org.postgresql.Driver

# ======================================
# JPA Configuration
# ======================================
spring.jpa.open-in-view=false

# Hibernate Configuration
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ======================================
# Server Configuration
# ======================================
server.port=8080
server.servlet.context-path=/api

# ======================================
# Logging Configuration
# ======================================
logging.level.root=INFO
logging.level.com.jstore=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
