global:
  scrape_interval: 15s

scrape_configs:
  - job_name: j-store
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["j-store:8080"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
